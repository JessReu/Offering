# 2. Zweisprachige, rechtlich geprüfte Textbausteine
text_blocks:
  # --- DEUTSCH ---
  intro_standard_de: |
    Sehr geehrte Damen und Herren,

    vielen Dank für das angenehme Gespräch und Ihr Interesse an den digitalen Softwarelösungen der Bosch Connected Industry. 

    Die Europäische Batterieverordnung fordert ab Februar 2027 für alle Industrie- und Elektrofahrzeugbatterien einen digitalen Herkunftsnachweis. Gerne unterbreiten wir Ihnen auf Basis unserer Abstimmung das folgende Angebot für die Bereitstellung des Digitalen Batterie-Passports (SaaS-Lösung auf Basis des Bosch Semantic Stack) zur revisionssicheren Dokumentation Ihres Produktlebenszyklus.
  
  vertragsbedingungen_de: |
    ### Ergänzende Vertragsbedingungen (AGB)
    * **Abrechnungsverfahren:** Die verbrauchsabhängige Erfassung und Abrechnung (z. B. für zusätzliche digitale Zwillinge oder Speicherüberschreitungen) erfolgen automatisiert und monatlich über die Bosch-interne LAGO-Plattform.
    * **Nutzungsbedingungen:** Für die entgeltliche Bereitstellung der Software gelten die aktuellen Allgemeinen Bedingungen für Software-as-a-Service (SaaS-Nutzungsbedingungen) der Robert Bosch Manufacturing Solutions GmbH.
    * **Gerichtsstand:** Es gilt das Recht der Bundesrepublik Deutschland unter Ausschluss des UN-Kaufrechts (CISG). Ausschließlicher Gerichtsstand ist Stuttgart, Deutschland.

  # --- ENGLISH ---
  intro_standard_en: |
    Dear Sir or Madam,

    Thank you for the pleasant conversation and your interest in the digital software solutions of Bosch Connected Industry.

    As of February 2027, the European Battery Regulation mandates a digital certificate of origin for all industrial and electric vehicle batteries. Based on our alignment, we are pleased to submit the following proposal for the provision of the Digital Battery Passport (SaaS solution based on the Bosch Semantic Stack) for the audit-proof documentation of your product lifecycle.
  
  vertragsbedingungen_en: |
    ### Supplementary Terms and Conditions (T&Cs)
    * **Billing Procedure:** Usage-based tracking and billing (e.g., for additional digital twins or storage overage) are conducted automatically and monthly via the Bosch-internal LAGO platform.
    * **Terms of Use:** The provision of the software is governed by the current General Terms and Conditions for Software-as-a-Service (SaaS Terms of Use) of Robert Bosch Manufacturing Solutions GmbH.
    * **Jurisdiction:** This agreement shall be governed by the laws of the Federal Republic of Germany, excluding the UN Convention on Contracts for the International Sale of Goods (CISG). The exclusive place of jurisdiction is Stuttgart, Germany.
