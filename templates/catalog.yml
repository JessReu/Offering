# 2. PROFESSIONAL SERVICES & CONSULTING (Dienstleistungen)
services:
  PAS-SC:
    bereich: PAS
    produkt: Service
    variante: Solution Consulting
    kurztext_de: "Servicekontingent zur Standardimplementierung der Bosch Digital Battery Passport Software Lösung mit Datenintegration aus bis zu 2 Datenquellen. Dienstleistungskontingent mit einer Abschätzung der Personentage. Die Abrechnung erfolgt nach tatsächlichem Aufwand."
    kurztext_en: "Service contingent for the standard implementation of the Bosch Digital Battery Passport Software Solution with data integration from up to 2 data sources. Service contingent with an estimate of person-days. Billing is based on actual effort."
    preis: 1560.0
    einheit: PT
    kategorie: DL
    materialnummer: "573"
    phek_faktor: "1807000573"
    product_owner: Ulrich Wolters
    product_manager: Steffen Stadtmüller

  AAI-II:
    bereich: AAI
    produkt: Service
    variante: IT Integration
    kurztext_de: "Dienstleistungskontingent auf Grundlage einer Aufwandsschätzung in Personentagen. Konfiguration von Datenverbindungen und Anbindung von Softwaresystemen (Voraussetzung: Die zu integrierenden Datenquellen und anzubindende Software müssen über eine webbasierte Programmschnittstelle (Web-API) verfügen). Umsetzung der folgenden zwei geplanten Anwendungsfälle: • Anwendungsfall 1: Interne Instandhaltung • Anwendungsfall 2: Field Service"
    kurztext_en: "Service quota based on an effort estimation in person-days. Configuration of data connections and integration of software systems (Prerequisite: The data sources to be integrated and the software to be connected must have a web-based application programming interface (web API)). Implementation of the following two planned use cases: • Use case 1: Internal Maintenance • Use case 2: Field Service"
    preis: 1560.0
    einheit: PT
    kategorie: DL
    materialnummer: "573"
    phek_faktor: "1807000573"
    product_owner: Ulrich Wolters
    product_manager: Philipp Glaser

