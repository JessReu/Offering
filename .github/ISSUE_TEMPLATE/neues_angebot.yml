name: "✍️ Neues Angebot anfordern (OTT Digital)"
description: "Digitales Angebots-Anforderungs-Formular (ehemals Excel-Tabelle)."
title: "[OTT-ANFORDERUNG]: "
labels: ["Angebots-Erstellung"]
body:
  - type: markdown
    attributes:
      value: |
        # 🔋 Bosch Battery Passport – Angebots-Anforderung (OTT)
        Bitte füllen Sie diese digitale Anforderung aus. 
        * **Gelbe Felder** = Pflichtfelder (müssen ausgefüllt werden)
        * **Blaue Felder** = Optionale Felder (Vorauswahl abweichend)

  # ==========================================
  # 🟨 PFLICHTFELDER (Ehemals GELB)
  # ==========================================
  - type: markdown
    attributes:
      value: "### 🟨 Pflichtangaben (Vor Angebotserstellung prüfen!)"

  - type: dropdown
    id: nda_check
    attributes:
      label: "🔒 Non-Disclosure Agreement (NDA)"
      description: "Nur bei externen Kunden notwendig. [Link NDA Richtlinie](https://inside-docupedia.bosch.com/confluence/display/SOM/NDA+-+Geheimhaltungsvertrag?src=contextnavpagetreemode)"
      options:
        - "NDA liegt bereits vor"
        - "NDA nicht notwendig (z.B. Interner Kunde)"
        - "NDA muss noch geschlossen werden"
    validations:
      required: true

  - type: dropdown
    id: laenderfreigabe
    attributes:
      label: "🌍 Länderfreigabe PAS"
      description: "Ist das Land für die Erbringung freigegeben? [Link Länderfreigabe](https://inside-docupedia.bosch.com/confluence/pages/viewpage.action?pageId=3839556221)"
      options:
        - "Ja (Freigabe erteilt)"
        - "Nein (Sonderfreigabe erforderlich)"
    validations:
      required: true

  - type: dropdown
    id: kunde_typ
    attributes:
      label: "🏢 Kundentyp"
      options:
        - "Intern (Geschäftsbereich)"
        - "Extern"
        - "Joint Venture (z.B. UAES / BHSS)"
    validations:
      required: true

  - type: input
    id: instep_nummer
    attributes:
      label: "🔢 InStep Nummer"
      description: "Bereits angelegte Nummer eintragen (z.B. 9200xxx.xxx)"
      placeholder: "9200123.001"
    validations:
      required: true

  - type: input
    id: kunden_name
    attributes:
      label: "🏢 Kundenname (Firma)"
      placeholder: "z.B. FeP/PS oder VW/EXT"
    validations:
      required: true

  - type: textarea
    id: lieferadresse
    attributes:
      label: "📍 Lieferadresse (Kunde)"
      placeholder: "Strasse, Hausnummer, PLZ, Ort, Land"
    validations:
      required: true

  - type: input
    id: projekt_bezeichnung
    attributes:
      label: "🏷️ Bezeichnung Projekt (InStep/Opportunity)"
      placeholder: "z.B. Battery Passport S Integration"
    validations:
      required: true

  - type: input
    id: liefertermin
    attributes:
      label: "📅 Geplanter Liefertermin (dd/mm/jjjj)"
      placeholder: "31/12/2026"
    validations:
      required: true

  - type: dropdown
    id: sprache
    attributes:
      label: "🌐 Sprache für Angebot"
      options:
        - "Deutsch"
        - "English"
    validations:
      required: true

  # ==========================================
  # 🟦 OPTIONALE FELDER (Ehemals BLAU)
  # ==========================================
  - type: markdown
    attributes:
      value: "### 🟦 Optionale Angaben (Abweichende Voraussetzungen)"

  - type: input
    id: angebotsgueltigkeit
    attributes:
      label: "⏳ Angebotsgültigkeit (Standard = 3 Monate)"
      placeholder: "z.B. 02.11.2026"
    validations:
      required: false

  - type: textarea
    id: anschreiben_text
    attributes:
      label: "✉️ Anschreiben-Text (Anrede / persönliches Anschreiben)"
      description: "Bei kurzen Anschreiben, Text einfach hier eingeben."
      placeholder: "Sehr geehrte Damen und Herren, anbei erhalten Sie..."
    validations:
      required: false

  - type: dropdown
    id: rbs_applikation
    attributes:
      label: "💻 RBS Applikation (SaaS-Lizenz)"
      options:
        - "Battery Passport - S Edition (BBP-S)"
        - "Keine SaaS-Applikation"
    validations:
      required: false

  - type: input
    id: saas_menge
    attributes:
      label: "🔢 SaaS Menge / Einheit"
      placeholder: "z.B. 1 Lizenz / 10.000 Twins"
    validations:
      required: false
