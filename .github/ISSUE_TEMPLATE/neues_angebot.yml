name: "Deal Acceleration Template"
description: "Erfasse hier schnell und fehlerfrei alle vertraglichen und kaufmännischen Daten für dein MAC-Angebot."
title: "[Anforderung]: "
labels: ["Angebots-Erstellung"]
body:
  - type: markdown
    attributes:
      value: |
        # Manufacturing Co-Intelligence
        ## MAC Deal Acceleration Template (DAT)
        
        Hi! Trage hier einfach die kaufmännischen und vertraglichen Details für dein Angebot ein. 
        Pflichtfelder sind für dich markiert, damit die Erstellung im Sales Execution Team danach sofort und ohne Rückfragen durchläuft.
        
        *Alle verlinkten Richtlinien entsprechen dem aktuellen Freigabestand der MAC MASTER MATRIX.*

  # ==========================================
  # SEKTION 1: IN-STEP PROJEKTPRÜFUNG
  # ==========================================
  - type: markdown
    attributes:
      value: |
        ---
        ### 1. InStep-Projektprüfung (Vorab-Check)

  - type: dropdown
    id: instep_bekannt
    attributes:
      label: "Ist dir bereits eine Projektnummer aus In-STEP bekannt?"
      description: "Wähle 'Ja', wenn das Projekt bereits in InStep angelegt wurde."
      options:
        - "Ja"
        - "Nein (Bitte Hinweis unten beachten!)"
    validations:
      required: true

  - type: input
    id: instep_nummer
    attributes:
      label: "InStep-Nummer"
      description: "Falls du oben 'Ja' ausgewählt hast: Trage hier bitte die zugehörige Projektnummer ein (z.B. 9200xxx.xxx)."
      placeholder: "9200123.001"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        > 🛑 **Wichtiger Hinweis bei fehlender in-STEP-Nummer:**
        > Falls dir noch **keine** Projektnummer bekannt ist, kontaktiere direkt das Sales Execution Team unter:
        > [Order.Manufacturing-Co-Intelligence@bosch.com](mailto:Order.Manufacturing-Co-Intelligence@bosch.com?subject=Anforderung%20InStep-Projektnummer) zwecks Anlage des Projekts.

  # ==========================================
  # SEKTION 2: PROJEKT- & KUNDENDATEN
  # ==========================================
  - type: markdown
    attributes:
      value: |
        ---
        ### 2. Projekt- & Kundendaten

  - type: dropdown
    id: sprache
    attributes:
      label: "Dokumentensprache"
      description: "In welcher Sprache soll das Angebot für deinen Kunden erzeugt werden?"
      options:
        - "Deutsch"
        - "English"
    validations:
      required: true

  - type: input
    id: kunden_name
    attributes:
      label: "Kundenname (Firma)"
      description: "Trage bitte den Kundennamen ein inkl. Rechtseinheit."
      placeholder: "z.B. Robert Bosch GmbH (intern) oder Kundenname GmbH (extern)"
    validations:
      required: true

  # ==========================================
  # SEKTION 3: ANSCHREIBEN & KOMMUNIKATION (NEU!)
  # ==========================================
  - type: markdown
    attributes:
      value: |
        ---
        ### 3. Anschreiben & Kundenkommunikation

  - type: dropdown
    id: anschreiben_anrede
    attributes:
      label: "Anrede im Angebotsschreiben"
      description: "Wie soll der Kunde im Anschreiben angesprochen werden?"
      options:
        - "Sehr geehrte Damen und Herren,"
        - "Sehr geehrte Frau / Sehr geehrter Herr,"
        - "Dear Sir or Madam,"
        - "Dear Team,"
    validations:
      required: true

  - type: textarea
    id: anschreiben_text
    attributes:
      label: "Individueller Einleitungstext / Anschreiben"
      description: "Gib hier deinen persönlichen Anschreibentext ein. Falls du nichts einträgst, wird automatisch der standardisierte MAC-Einleitungstext aus dem Datenkatalog genutzt."
      placeholder: "z.B. Vielen Dank für das angenehme Gespräch auf der Messe..."
    validations:
      required: false

  # ==========================================
  # SEKTION 4: COMPLIANCE
  # ==========================================
  - type: markdown
    attributes:
      value: |
        ---
        ### 4. Compliance & Vorprüfungen

  - type: dropdown
    id: nda_check
    attributes:
      label: "Geheimhaltungsvereinbarung (NDA)"
      description: "Wichtig bei externen Partnern."
      options:
        - "NDA liegt bereits vor / unterzeichnet"
        - "Nicht erforderlich (Internes Bosch-Geschäft)"
        - "NDA-Prüfung ausstehend"
    validations:
      required: true

  - type: dropdown
    id: laenderfreigabe
    attributes:
      label: "Länderfreigabe"
      description: "Ist das Land für die Erbringung freigegeben?"
      options:
        - "Länderfreigabe erteilt"
        - "Sonderfreigabe erforderlich / beantragt"
    validations:
      required: true

  # ==========================================
  # SEKTION 5: SOFTWARE-AS-A-SERVICE
  # ==========================================
  - type: markdown
    attributes:
      value: |
        ---
        ### 5. Software-as-a-Service (SaaS) Tarife

  - type: dropdown
    id: saas_produkt
    attributes:
      label: "Wähle das SaaS-Produkt aus:"
      description: "Diese Optionen entsprechen exakt den IDs in deinem Datenkatalog."
      options:
        - "PAS-BP-S: PAS Battery Passport S (39.900,00 € / Jahr)"
        - "PAS-BP-M: PAS Battery Passport M (59.200,00 € / Jahr)"
        - "PAS-BP-L: PAS Battery Passport L (102.000,00 € / Jahr)"
        - "PAS-BP-XL: PAS Battery Passport XL (190.000,00 € / Jahr)"
        - "PAS-SS-SS: PAS Semantic Stack Starter (0,00 € / Jahr)"
        - "PAS-SS-S: PAS Semantic Stack S (42.000,00 € / Jahr)"
        - "PAS-SS-M: PAS Semantic Stack M (113.500,00 € / Jahr)"
        - "PAS-SS-L: PAS Semantic Stack L (340.000,00 € / Jahr)"
        - "PAS-SS-XL: PAS Semantic Stack XL (1.030.000,00 € / Jahr)"
        - "AAI-EXPLORE: Agentic AI Explore (35.000,00 € / Jahr)"
        - "AAI-SCALE: Agentic AI Scale (145.000,00 € / Jahr)"
        - "AAI-TRANSFORM: Agentic AI Transform (415.000,00 € / Jahr)"
        - "Kein SaaS-Produkt (Nur Dienstleistung)"
    validations:
      required: true

  - type: input
    id: saas_menge
    attributes:
      label: "Menge / Einheiten (Standard = 1 LE)"
      placeholder: "1"
    validations:
      required: true

  - type: dropdown
    id: saas_rabatt
    attributes:
      label: "Rabatt auf SaaS-Komponenten"
      options:
        - "0%"
        - "5%"
        - "10%"
        - "Sonderkondition"
    validations:
      required: true

  # ==========================================
  # SEKTION 6: SERVICES & PROFESSIONAL SERVICES
  # ==========================================
  - type: markdown
    attributes:
      value: |
        ---
        ### 6. Professional Services (Optionale Dienstleistungen)

  - type: dropdown
    id: service_produkt
    attributes:
      label: "Wähle das Dienstleistungsprodukt aus:"
      options:
        - "PAS-SC: PAS Solution Consulting (1.560,00 € / Personentag)"
        - "AAI-II: AAI IT Integration Services (1.560,00 € / Personentag)"
        - "Keine Dienstleistung benötigt"

  - type: input
    id: service_tage
    attributes:
      label: "Gewünschtes Dienstleistungsvolumen (in Personentagen)"
      placeholder: "z.B. 10"

  - type: dropdown
    id: reisekosten
    attributes:
      label: "Reisekosten-Regelung"
      options:
        - "Abrechnung nach tatsächlichem Aufwand (Bosch-Reiserichtlinie)"
        - "Reisekostenpauschale vereinbart"
        - "Keine Reisekosten (Ausschließlich Remote-Erbringung)"

  - type: textarea
    id: service_text
    attributes:
      label: "Positionstext Dienstleistung"
      description: "Beschreibe hier kurz, welche Aufgaben bei der Dienstleistung übernommen werden."
      placeholder: "z.B. Unterstützung bei der Systemintegration, Anbindung an Fabrik-MES-Systeme..."

  # ==========================================
  # SEKTION 7: SONDERKONDITIONEN & ABWEICHENDE AGBs (NEU!)
  # ==========================================
  - type: markdown
    attributes:
      value: |
        ---
        ### 7. Sonderkonditionen & Abweichungen

  - type: textarea
    id: abweichende_bedingungen
    attributes:
      label: "Abweichende AGBs / Sonderbedingungen"
      description: "Trage hier abweichende Bedingungen ein, falls ein spezieller Rahmenvertrag vorliegt (inkl. Rahmenvertragsnummer)."
      placeholder: "z.B. Es gilt der Rahmenvertrag mit der Vertragsnummer..."
    validations:
      required: false
