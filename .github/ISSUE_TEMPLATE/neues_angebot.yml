# 3. Zweisprachige Textbausteine
text_blocks:
  intro_standard_de: |
    Sehr geehrte Damen und Herren,

    vielen Dank für das angenehme Gespräch und Ihr Interesse an den digitalen Softwarelösungen der Robert Bosch GmbH. 

    Die Europäische Batterieverordnung fordert ab Februar 2027 für alle Industrie- und Elektrofahrzeugbatterien einen digitalen Herkunftsnachweis. Gerne unterbreiten wir Ihnen auf Basis unserer Abstimmung das folgende Angebot für die Bereitstellung des Digitalen Batterie-Passports (SaaS-Lösung auf Basis des Bosch Semantic Stack) zur revisionssicheren Dokumentation Ihres Produktlebenszyklus.
  
  vertragsbedingungen_de: |
    ### Ergänzende Vertragsbedingungen (AGB)
    * **LAGO-Abrechnung:** Die verbrauchsabhängige Abrechnung erfolgt automatisiert über die LAGO-Plattform.
    * **SaaS-Richtlinien:** Es gelten die offiziellen [SaaS-Nutzungsbedingungen (Version 2.5)](https://sites.inside-share4.bosch.com/sites/049255/Documents/99_Nexeed_customer_contract_templates/01_IAS/03_TermsConditions/10_DE/3-b_BCI_SaaS_Nutzungsbedingungen.pdf(1)/3-b_BCI_SaaS_Nutzungsbedingungen_2.5.pdf) der Robert Bosch Manufacturing Solutions GmbH.
    * **Service Level (SLA):** Der Betrieb der Anwendung richtet sich nach dem [Service Level Agreement (SLA) für den Bosch Semantic Stack](https://sites.inside-share4.bosch.com/sites/049255/Documents/99_Nexeed_customer_contract_templates/07_RBS/02_Specification_Leistungsbeschreibung/10_DE/Service%20Level%20Agreement_Bosch%20Semantic%20Stack_KUNDE.pdf(1)/Service%20Level%20Agreement_Bosch%20Semantic%20Stack_KUNDE_1.0.pdf).

  intro_standard_en: |
    Dear Sir or Madam,

    Thank you for the pleasant conversation and your interest in the digital software solutions of Robert Bosch GmbH.

    As of February 2027, the European Battery Regulation mandates a digital certificate of origin for all industrial and electric vehicle batteries. Based on our alignment, we are pleased to submit the following proposal for the provision of the Digital Battery Passport (SaaS solution based on the Bosch Semantic Stack) for the audit-proof documentation of your product lifecycle.
  
  vertragsbedingungen_en: |
    ### Supplementary Terms and Conditions (T&Cs)
    * **LAGO Billing:** Usage-based tracking and billing are conducted automatically via the internal LAGO platform.
    * **SaaS Guidelines:** The provision of the software is governed by the [SaaS Terms of Use](https://inside-share-hosted-apps.bosch.com/DMS/GetDocumentService/Document.svc/GetDocumentURL?documentID=P01S049255-1109783333-920&status=validrevision) of Robert Bosch Manufacturing Solutions GmbH.
    * **Service Level (SLA):** Operations are governed by the official [Service Level Agreement (SLA) for the Bosch Semantic Stack](https://sites.inside-share4.bosch.com/sites/049255/Documents/99_Nexeed_customer_contract_templates/07_RBS/02_Specification_Leistungsbeschreibung/10_DE/Service%20Level%20Agreement_Bosch%20Semantic%20Stack_KUNDE.pdf(1)/Service%20Level%20Agreement_Bosch%20Semantic%20Stack_KUNDE_1.0.pdf).
